services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_radar
      POSTGRES_PASSWORD: job_radar
      POSTGRES_DB: job_radar
    ports:
      # Published on 5433 on the host: 5432 is commonly already taken by
      # a native/Homebrew Postgres install. Containers still talk to each
      # other over the internal Docker network on 5432 regardless.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_radar -d job_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://job_radar:job_radar@postgres:5432/job_radar?sslmode=disable
      REDIS_ADDR: redis:6379
      API_PORT: "8080"
      FRONTEND_ORIGIN: "http://localhost:5173"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://job_radar:job_radar@postgres:5432/job_radar?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
